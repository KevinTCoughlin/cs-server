#
# Docker Desktop for Windows override.
#
#   docker compose -f compose.yml -f compose.windows.yml up -d
#
# It changes one thing: NOMASTER=1 (-nomaster -insecure), which keeps
# steamclient.so from hanging at start under Docker Desktop. The server is
# then not VAC secured, not on the master list, and answers no server-browser
# queries: clients connect by address.
#
# Everything else in compose.yml applies unchanged: the bind-mounted config,
# the state volume, the read-only root and dropped capabilities. (Earlier versions of this file set empty lists to remove some of
# those. Compose appends lists when it merges files, so they removed nothing.)
#
# UDP port forwarding on Docker Desktop for Windows is unreliable. Prefer a
# container engine inside WSL2 (Podman or Docker CE); see the README.
services:
  cstrike:
    environment:
      NOMASTER: "1"
