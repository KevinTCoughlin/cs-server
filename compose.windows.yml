# =============================================================================
# Docker Desktop for Windows Overrides
# =============================================================================
# This override file works around Docker Desktop limitations on Windows.
#
# Usage: docker compose -f compose.yml -f compose.windows.yml up -d
#
# Key differences from standard compose.yml:
# - Removed sysctls (net.core.rmem_max/wmem_max not available in Docker Desktop)
# - Removed cap_drop + security_opt (too restrictive for Docker Desktop networking)
# - Removed :Z SELinux flags from bind mounts (Docker ignores, but causes issues)
# - Removed bind mounts entirely (configs baked into image)
# - Added NOMASTER=1 to enable -nomaster -insecure flags (prevents steamclient hang)
#
# IMPORTANT: UDP port forwarding on Docker Desktop for Windows is unreliable.
# For best results, run the container natively in WSL2 with Podman or Docker CE
# (not Docker Desktop). See README.md for WSL2-native workflow.
# =============================================================================

services:
  cstrike:
    # Remove Podman-specific sysctls — not available in Docker Desktop VM
    sysctls: []

    # Remove restrictive security settings — Docker Desktop needs more flexibility
    cap_drop: []
    security_opt: []

    # Remove bind mounts — configs are baked into the image
    # This avoids :Z SELinux flag issues and read-only mount problems
    volumes: []

    # Enable -nomaster -insecure flags to prevent steamclient.so hang
    environment:
      - MAXPLAYERS=20
      - MAP=scoutzknivez
      - PORT=27015
      - BOTS=1
      - NOMASTER=1
      - MAPCYCLE=mapcycle.txt
