# SPDX-License-Identifier: MIT
# Builds and deploys docs/ to GitHub Pages. Replaces the legacy
# "deploy from branch" build, whose built-in workflow runs on Node 20
# actions and the floating ubuntu-latest label.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

# One production deploy at a time. Pull requests build in their own group
# so a check cannot hold up the deploy, and they never deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # Same Jekyll build the legacy pipeline ran, so .md pages still render.
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      # docs/records is static (no front matter), so Jekyll copies it unchanged.
      # The fetch call is fetch("./records.json", ...): a pattern that requires
      # the closing paren immediately after the quote does not match, and with
      # bash -e that failed the build before the artifact was uploaded.
      - name: Records page is in the site
        run: |
          test -s _site/records/index.html || { echo "missing _site/records/index.html" >&2; exit 1; }
          test -s _site/records/records.json || { echo "missing _site/records/records.json" >&2; exit 1; }
          grep -q 'fetch("./records.json"' _site/records/index.html || { echo "records page does not fetch ./records.json" >&2; exit 1; }
          if [ -d _site/cstrike ] && find _site/cstrike -name records.json -print -quit | grep -q .; then
            echo "records.json must not be published under cstrike/" >&2
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
