# SPDX-License-Identifier: MIT
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded PR runs only; push/schedule runs get a unique group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Lint Containerfile with hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Containerfile

      - name: Lint shell scripts with shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          version: v0.11.0
          scandir: .
          additional_files: entrypoint.sh install.sh

      - name: Run entrypoint regression tests
        run: |
          bash tests/entrypoint_test.sh
          bash tests/compose_test.sh
