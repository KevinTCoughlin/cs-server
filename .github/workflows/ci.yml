# SPDX-License-Identifier: MIT
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded PR runs only; push/schedule runs get a unique group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Lint Containerfile with hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Containerfile

      - name: Lint shell scripts with shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          version: v0.11.0
          scandir: .
          additional_files: entrypoint.sh install.sh ops/cs-server

      - name: Run script tests
        run: |
          bash tests/entrypoint_test.sh
          bash tests/shutdown_test.sh
          bash tests/mapcycle_test.sh
          bash tests/dod_config_test.sh
          bash tests/mounts_test.sh
          bash tests/mode_test.sh
          bash tests/fetch_maps_test.sh
          bash tests/install_test.sh
          bash tests/release_notes_test.sh
          bash tests/firewall_test.sh
          bash tests/ops_test.sh
          bash tests/bootstrap_test.sh
          bash tests/backup_test.sh
          bash tests/backup_docker_test.sh
          bash tests/compose_test.sh
          bash tests/regamedll_build_test.sh
          bash tests/nav_openlist_repro_test.sh

  bootstrap:
    name: Bootstrap dry-run (${{ matrix.image }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [debian:13, ubuntu:24.04]
    steps:
      - uses: actions/checkout@v7

      - name: Dry-run inside ${{ matrix.image }}
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/src:ro" -w /src "${{ matrix.image }}" \
            bash ops/bootstrap-vps.sh --dry-run
