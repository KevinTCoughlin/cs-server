# SPDX-License-Identifier: MIT
name: Docker Image Build & Scan

# A `v*.*.*` tag is a release: the same build and tests, then the version tags
# on the image and a GitHub release. Path filters do not apply to tag pushes.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - 'Containerfile'
      - '.containerignore'
      - 'entrypoint.sh'
      - 'scripts/**'
      - 'config/**'
      - 'plugins/**'
      - 'maps/**'
      - 'docs/cstrike/maps/**'
      - 'ops/seccomp/**'
      - 'tests/e2e_test.sh'
      - 'tests/lib.sh'
      - '.github/workflows/docker.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Containerfile'
      - '.containerignore'
      - 'entrypoint.sh'
      - 'scripts/**'
      - 'config/**'
      - 'plugins/**'
      - 'maps/**'
      - 'docs/cstrike/maps/**'
      - 'ops/seccomp/**'
      - 'tests/e2e_test.sh'
      - 'tests/lib.sh'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write
  security-events: write

# Cancel superseded PR runs only; push/schedule runs get a unique group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One native build per architecture. arm64 runs on a Linux arm runner; the
  # image there carries the i386 HLDS payload under qemu-i386 (the same image
  # Apple `container` runs on Apple silicon).
  image:
    name: image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            steam_timeout: 180
            e2e_timeout_scale: 1
          - arch: arm64
            runner: ubuntu-24.04-arm
            steam_timeout: 300
            e2e_timeout_scale: 2
    env:
      LOCAL_IMAGE: local/cs-server:ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Lowercase image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=CS 1.6 ScoutzKnivez Server
            org.opencontainers.image.description=Containerized Counter-Strike 1.6 ScoutzKnivez server using the ReHLDS stack
            org.opencontainers.image.vendor=KevinTCoughlin
            org.opencontainers.image.licenses=MIT

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: ${{ env.LOCAL_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Smoke test — verify binaries present and executable
        run: |
          docker run --rm \
            --entrypoint /bin/sh \
            "${LOCAL_IMAGE}" \
            -c "test -x /hlds/hlds_linux && test -x /hlds/hlds_run && test -x /entrypoint.sh && test -s /etc/ssl/certs/ca-certificates.crt"

      # Runs the server for real, under Docker's built-in seccomp profile:
      # a server that cannot open its port crash-loops, which the file checks
      # above can't see. On arm64 this is the only CI coverage of the
      # qemu-i386 path. (The newest Docker is checked in docker-latest.yml.)
      - name: Smoke test — server starts and reaches Steam
        env:
          STEAM_TIMEOUT: ${{ matrix.steam_timeout }}
        run: |
          docker run -d --name hlds-smoke \
            --cap-drop ALL --security-opt no-new-privileges:true "${LOCAL_IMAGE}"
          for _ in $(seq $((STEAM_TIMEOUT / 3))); do
            if docker logs hlds-smoke 2>&1 | grep -q 'Connection to Steam servers successful'; then
              docker logs hlds-smoke 2>&1 | grep -E 'Connection to Steam|VAC secure'
              docker exec hlds-smoke /healthcheck.sh
              echo 'health check: server answers a ping on its game port'
              docker rm -f hlds-smoke >/dev/null
              exit 0
            fi
            sleep 3
          done
          echo "::error::HLDS did not report a Steam connection within ${STEAM_TIMEOUT}s"
          docker logs hlds-smoke 2>&1 | tail -40
          docker rm -f hlds-smoke >/dev/null
          exit 1

      # Drives the running server through its console FIFO: every plugin
      # loads, mode switching in both directions, each mapcycle map in the
      # image, graceful shutdown. NOMASTER + LAN mode: no dependency on Steam.
      - name: End-to-end test — plugins, mode switching, maps, shutdown
        env:
          CS_E2E_TIMEOUT_SCALE: ${{ matrix.e2e_timeout_scale }}
        run: bash tests/e2e_test.sh docker "${LOCAL_IMAGE}"

      - name: Run Trivy vulnerability scanner
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          # The Security tab gets what can be acted on: critical and high
          # findings that have a fixed package to move to. Without the first
          # option the action ignores `severity` for SARIF and uploads every
          # level. The table below still lists unfixed findings in the log.
          limit-severities-for-sarif: true
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.trivy.outcome == 'success'
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy-${{ matrix.arch }}

      - name: Run Trivy vulnerability scanner (table format)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'

      # Push this architecture untagged; the `publish` job tags a manifest
      # list that points at both digests.
      - name: Push image by digest
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Single check name covering every architecture (the job was a single
  # amd64 build before the matrix).
  build-and-scan:
    needs: image
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every image build to pass
        env:
          RESULT: ${{ needs.image.result }}
        run: |
          echo "image builds: ${RESULT}"
          [ "${RESULT}" = success ]

  publish:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04

    steps:
      - name: Lowercase image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create and push the multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "${DOCKER_METADATA_OUTPUT_JSON}")
          sources=$(printf "${REGISTRY}/${IMAGE_NAME}@sha256:%s " *)
          # shellcheck disable=SC2086 # word splitting is intended
          docker buildx imagetools create ${tags} ${sources}

      - name: Inspect manifest
        run: docker buildx imagetools inspect "${{ fromJSON(steps.meta.outputs.json).tags[0] }}"

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 30

  # Tag pushes only: a GitHub release whose notes are the tag's CHANGELOG.md
  # section plus the image references, with the SBOM attached.
  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Lowercase image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Download SBOM
        uses: actions/download-artifact@v8
        with:
          name: sbom

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          image="${REGISTRY}/${IMAGE_NAME}"
          digest=$(docker buildx imagetools inspect "${image}:${version}" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "${digest}" == sha256:* ]] || { echo "::error::no digest for ${image}:${version}"; exit 1; }
          # shellcheck disable=SC2016 # the backticks are Markdown
          {
            bash scripts/release-notes.sh "${version}"
            printf '\n### Image\n\n'
            printf 'Multi-arch (`linux/amd64`, `linux/arm64`):\n\n'
            printf -- '- `%s:%s`\n' "${image}" "${version}"
            printf -- '- `%s@%s`\n\n' "${image}" "${digest}"
            printf 'Install or upgrade to this release:\n\n'
            printf '```bash\ncurl -fsSL https://raw.githubusercontent.com/%s/%s/install.sh | CS_SERVER_VERSION=%s bash\n```\n' "${GITHUB_REPOSITORY}" "${TAG}" "${version}"
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "${TAG}" --verify-tag --title "${TAG}" --notes-file release-notes.md sbom.spdx.json
