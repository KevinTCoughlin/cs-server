# SPDX-License-Identifier: MIT
name: Weekly

on:
  schedule:
    # Weekly, Monday 00:00 UTC (nothing consumes a daily image; the tag stays `nightly`)
    - cron: "0 0 * * 1"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  image:
    name: Weekly Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      LOCAL_IMAGE: local/cs-server:nightly

    steps:
      - uses: actions/checkout@v7

      - name: Refuse uncleared maps in the build context
        run: bash scripts/check-published-maps.sh maps docs/cstrike/maps

      - name: Lowercase image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build container image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          build-args: MAP_POLICY=cleared
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: ${{ env.LOCAL_IMAGE }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Refuse uncleared maps in the image
        run: bash scripts/check-published-maps.sh --from-image docker "${LOCAL_IMAGE}"

      - name: Run Trivy vulnerability scanner
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          # The Security tab gets what can be acted on: critical and high
          # findings that have a fixed package to move to. Without the first
          # option the action ignores `severity` for SARIF and uploads every
          # level. The table below still lists unfixed findings in the log.
          limit-severities-for-sarif: true
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.trivy.outcome == 'success'
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy-${{ matrix.arch }}

      - name: Run Trivy vulnerability scanner (table format)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Push image by digest
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          build-args: MAP_POLICY=cleared
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish nightly manifest
    needs: image
    runs-on: ubuntu-24.04

    steps:
      - name: Lowercase image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push the multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          sources=$(printf "${REGISTRY}/${IMAGE_NAME}@sha256:%s " *)
          # shellcheck disable=SC2086 # word splitting is intended
          docker buildx imagetools create -t "${REGISTRY}/${IMAGE_NAME}:nightly" ${sources}
          docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:nightly"
