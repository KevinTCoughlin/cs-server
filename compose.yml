services:
  cstrike:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/cs-server:latest
    container_name: scoutzknivez
    ports:
      - "27015:27015/udp"
    volumes:
      - ./config/server.cfg:/hlds/cstrike/server.cfg:ro,Z
      - ./config/mapcycle.txt:/hlds/cstrike/mapcycle.txt:ro,Z
      - ./config/mapcycle-dust2.txt:/hlds/cstrike/mapcycle-dust2.txt:ro,Z
      - ./config/mapcycle-nipper.txt:/hlds/cstrike/mapcycle-nipper.txt:ro,Z
      - ./config/mapcycle-nipper-xmas.txt:/hlds/cstrike/mapcycle-nipper-xmas.txt:ro,Z
      - ./config/modes:/hlds/cstrike/modes:ro,Z
      # Bans, admins, stats and logs: everything the server writes.
      - state:/hlds/state
    environment:
      MAXPLAYERS: ${MAXPLAYERS:-20}
      MAP: ${MAP:-scoutzknivez}
      PORT: ${PORT:-27015}
      BOTS: ${BOTS:-1}
      NOMASTER: ${NOMASTER:-0}
      MAPCYCLE: ${MAPCYCLE:-mapcycle.txt}
      LAN_MODE: ${LAN_MODE:-0}
      MODE: ${MODE:-scoutz}
      FASTDL_URL: ${FASTDL_URL:-}
      LOGS: ${LOGS:-1}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-7}
      LOGADDRESS: ${LOGADDRESS:-}
    sysctls:
      - net.core.rmem_max=26214400
      - net.core.wmem_max=26214400
    # The image is immutable at run time: writes go to the state volume or
    # to /tmp (console FIFO).
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      # Docker's default seccomp profile answers HLDS's 32-bit socket() with
      # ENOSYS (server can't open its port). Podman's default allows it.
      - seccomp:unconfined
    mem_limit: 512m
    cpus: 2.0
    stop_grace_period: 50s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  # A fixed name, so the Quadlet unit and `just deploy` use the same volume.
  state:
    name: cs-server-state
