services:
  cstrike:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/cs-server:latest
    container_name: scoutzknivez
    ports:
      - "27015:27015/udp"
      - "27015:27015/tcp"
    volumes:
      - ./config/server.cfg:/hlds/cstrike/server.cfg:ro
      - ./config/mapcycle.txt:/hlds/cstrike/mapcycle.txt:ro
    environment:
      - MAXPLAYERS=20
      - MAP=scoutzknivez
      - PORT=27015
      - BOTS=1
    stop_grace_period: 50s
    restart: unless-stopped
