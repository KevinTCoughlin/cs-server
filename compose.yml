services:
  cstrike:
    build: .
    container_name: scoutzknivez
    ports:
      - "27015:27015/udp"
      - "27015:27015/tcp"
    volumes:
      - ./config/server.cfg:/hlds/cstrike/server.cfg:ro
      - ./config/mapcycle.txt:/hlds/cstrike/mapcycle.txt:ro
      - ./maps:/hlds/cstrike/maps/scoutzknivez:ro
    environment:
      - MAXPLAYERS=20
      - MAP=scoutzknivez
      - PORT=27015
    restart: unless-stopped
