; AMX Mod X plugins for MODE=auto (surf and climb, chosen per map).
; The same list as climb.ini and surf.ini: one server cannot swap plugin
; lists when the map changes (amxx_plugins is read at map load, and both
; modes need the same plugins). Bunny hop is loaded either way;
; modes/climb.cfg turns it off and modes/surf.cfg turns it on.
; scoutzknivez.amxx stays above movement.amxx so sk_mapmode is set first.

admin.amxx
admincmd.amxx
adminhelp.amxx
