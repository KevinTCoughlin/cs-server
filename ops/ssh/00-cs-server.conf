# Managed for the cs-server VPS. Named 00- because sshd uses the FIRST value it
# reads and sshd_config.d is read in lexical order, so this file beats 50-* and
# 99-ctrl.conf (a provider rewrite of 99-ctrl.conf cannot re-enable passwords).
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PubkeyAuthentication yes
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
