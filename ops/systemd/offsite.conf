#
# Installed by ops/bootstrap-vps.sh as
# ~/.config/systemd/user/cs-server-backup.service.d/offsite.conf
# only when ~/.config/cs-server/offsite.env exists and is mode 0600.
# Removed again when that file is absent, so a re-run disables the hook.

[Service]
ExecStartPost=%h/.local/bin/cs-server-offsite
