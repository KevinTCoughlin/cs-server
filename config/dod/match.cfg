// 6v6 practice and scrim settings. Not an official KTP config.
//
// KTP Season 10 (Fall 2026) is six-a-side: rules §2.10,
// https://ktpleague.gg/rules. The league's server list shows 12 slots
// (https://ktpleague.gg/servers). Slot count is the launch parameter
// MAXPLAYERS, which the installer sets to 12 for DOD_MODE=match. This
// file cannot change it.
//
// Regulation clock: KTP does not publish mp_timelimit. Rule §1.4 requires
// "the correct KTP league config for that map", and that file is not on
// the site. One recorded Season 10 game on dod_anzio is listed as
// "2 halves · 40:08"
// (https://ktpleague.gg/stats/matches/1791162528-CHI1). This file uses
// 20 minutes for one half, which is one map load. 20 is not a published
// league rule.
//
// Overtime is published: rules §1.10, halves of 10 minutes, sides switch
// for the second, then further 10-minute halves until there is a winner.
// From the server console: exec match-ot.cfg, then changelevel <map>.
//
// Password: "Servers are password-protected during matches"
// (https://ktpleague.gg/servers). Set DOD_PASSWORD, or sv_password from
// the console. This file does not set sv_password, so exec'ing it does
// not clear one.
//
// Logging: rules §1.5. The entrypoint also passes +log on when LOGS=1.
//
// There is no ready-up plugin. KTP's .ready / .ktp / .tech commands belong
// to the league's match plugin (https://ktpleague.gg/servers), which is
// not included. To hold the clock: mp_timelimit 0. When both teams are
// in: exec match.cfg, then changelevel <map>, which starts a fresh
// 20-minute half. Each half is its own map load (the league's match pages
// show halves as separate loads). Players change side between loads; the
// home team picks the first side (rules §2.3.a).
//
// Spectators: once a match is live, KTP forbids spectator (spec hopping).
// Nothing here enforces that. sv_maxspectators 2 leaves room for a coach
// or a referee on a practice server.
//
// HLTV is not started. Rule §1.5 requires a separate spectator proxy with
// at least a 120-second delay for an official game. -insecure is off
// unless INSECURE=1 or NOMASTER=1.
//
// Rates: dodbits lists 100000 as a top popular sv_maxrate ("good server")
// and 100 as a popular sv_maxupdaterate. sv_minrate 7500 and
// sv_minupdaterate 20 are their public recommendations. KTP does not
// publish rates. Twelve players is a small slot count, which is why
// match uses 100000 and pub stays at 25000.
//
// Map list: mapcycle-match.txt. It is dod_anzio only, the one Season 10
// pool map that ships with dedicated-server app 90. The rest of the pool
// is custom. See the README.

hostname "Day of Defeat 1.3 6v6"
// dodmode.amxx re-execs whichever file dod_cfg names on the next map.
dod_cfg "match.cfg"
mp_timelimit 20
mp_friendlyfire 1
mp_alliesclasses -1
mp_axisclasses -1
sv_maxrate 100000
sv_minrate 7500
sv_maxupdaterate 100
sv_minupdaterate 20
mp_allowspectators 1
sv_maxspectators 2
log on
