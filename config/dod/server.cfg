// Hostname is set by pub.cfg or match.cfg. It is not set here: the engine
// execs this file after the mode file on the first map, and a hostname here
// would replace the mode's.

// Shared by pub.cfg and match.cfg. The entrypoint execs one of those after
// this file (DOD_MODE, default pub). Rates, the map clock and the mode's
// hostname live in the mode file so `exec pub.cfg` or `exec match.cfg` from
// the server console can switch a running server.
//
// This is not an official KTP config. The league requires "the correct KTP
// league config for that map" (rules §1.4, https://ktpleague.gg/rules) and
// does not publish that file.

// Hit registration. Same setting config/games/common.cfg applies to every
// other game this image builds.
sv_unlag 1

sv_allowdownload 1
sv_allowupload 0
sv_cheats 0
pausable 0

// The entrypoint asks for sys_ticrate 1000, then execs this file, so this
// value wins. 300 is above the mode files' sv_maxupdaterate (66 or 100).
// The Counter-Strike server on the same host keeps 1000; this process is
// the one that shares a 2 vCPU machine with it.
sys_ticrate 300

// Query flood limits, ban logging, one log file per start, rcon lockout.
// Copied from config/games/common.cfg so replacing the stock server.cfg
// does not drop them.
sv_max_queries_sec 3
sv_max_queries_window 30
sv_logbans 1
sv_log_onefile 1
sv_rcon_maxfailures 5
sv_rcon_banpenalty 60
sv_filterban 1

// Friendly fire on, as in the published HLDS.pl Day of Defeat 1.3 example
// (http://hlds.pl/Serwer_Day_of_Defeat_1.3). KTP does not publish this cvar.
mp_friendlyfire 1

// Unlimited classes (engine default). KTP does not publish class limits.
mp_alliesclasses -1
mp_axisclasses -1

// Rules §1.5 require logging on a server used for an official game.
// LOGS=1 (the default) also passes +log on after this file.
log on
