// Day of Defeat server settings (image built with GAME=dod).
// Bind-mount your own over /hlds/dod/server.cfg to change them.
hostname "Day of Defeat"

mp_timelimit 30
mp_friendlyfire 0
mp_allowspectators 1
mp_alliesclasses -1
mp_axisclasses -1
mp_spawnbazookas 1

sv_maxrate 25000
sv_minrate 5000
sv_maxupdaterate 101
sv_minupdaterate 10
sv_unlag 1
sv_allowdownload 1
sv_allowupload 0
sv_cheats 0
pausable 0

// Query flood limits, ban logging, one log file per start, rcon lockout
sv_max_queries_sec 3
sv_max_queries_window 30
sv_logbans 1
sv_log_onefile 1
sv_rcon_maxfailures 5
sv_rcon_banpenalty 60
sv_filterban 1
