// Overtime half. KTP rules §1.10 (https://ktpleague.gg/rules):
// two halves of 10 minutes, teams switch sides for the second, then more
// 10-minute halves until there is a winner.
//
// From the server console, for each overtime half:
//   exec match-ot.cfg
//   changelevel dod_anzio
//
// A map change does not re-exec server.cfg, so 10 minutes stays in effect
// until another exec sets mp_timelimit. The next container start follows
// DOD_MODE again (match.cfg is 20 minutes).

// The next map load re-execs this file instead of match.cfg.
dod_cfg "match-ot.cfg"
mp_timelimit 10
