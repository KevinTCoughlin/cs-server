// Public 24/7 classic rotation. Map list: mapcycle.txt (stock maps only).
//
// Clock: dodbits, "DoD Ver 1.3 commands" (26 September 2023), lists
// mp_timelimit's default as 25 minutes.
// https://www.dodbits.com/dods/?Itemid=100035&id=41%3Adods-cvars-commands&layout=default&option=com_content&view=category
//
// Rates on that page, for a public server: sv_minrate 7500, sv_maxupdaterate
// 66, sv_minupdaterate 20. sv_maxrate 25000 is the figure they give for a
// poor link or few slots. This process shares 2 vCPU and 2.5 GB with the
// Counter-Strike server, so the higher popular values stay in match.cfg.
//
// Class limits stay unlimited. KTP does not publish any
// (https://ktpleague.gg/rules).
//
// No password. KTP match servers are password-protected
// (https://ktpleague.gg/servers); a public server is not one of those.

hostname "Day of Defeat 1.3"
// dodmode.amxx re-execs this file on every map. Keep the name in dod_cfg
// so a console `exec pub.cfg` is what the next map applies.
dod_cfg "pub.cfg"
mp_timelimit 25
mp_friendlyfire 1
mp_alliesclasses -1
mp_axisclasses -1
sv_maxrate 25000
sv_minrate 7500
sv_maxupdaterate 66
sv_minupdaterate 20
mp_allowspectators 1
sv_maxspectators 4
