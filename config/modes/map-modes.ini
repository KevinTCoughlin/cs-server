; Which settings MODE=auto uses for a map. MODE=climb and MODE=surf ignore
; this file and stay one mode for the whole rotation.
;
;   default <climb|surf>
;   exact <map> <climb|surf>
;   prefix <pattern> <climb|surf>
;
; exact wins. Otherwise the longest prefix that matches the start of the map
; name wins. ? is one character, so kz??_ is kz, two characters, then _.
; The last default line wins. The first exact line for a map wins.
default climb
prefix surf_ surf
prefix kz_ climb
prefix bkz_ climb
prefix kz??_ climb
prefix hb_ climb
prefix bhop_ climb
