// Surf mode: stock gravity, air acceleration 100 (what the ramps need), no
// fall damage and no rounds. scoutzknivez.amxx execs server.cfg and then this
// file on every map; movement.amxx (addons/amxmodx/configs/modes/surf.ini)
// runs the timer zones, checkpoints and top lists. A mode sets every one of
// the first block, so nothing is left over from the mode before it.
sv_gravity 800
sv_airaccelerate 100
mp_freezetime 0
mp_buytime 0
mp_roundtime 9
mp_startmoney 800
bot_knives_only 0

// movement.amxx resets the first four when the mode is left; the rest are
// server.cfg's.
mp_round_infinite 1
mp_forcerespawn 1
mp_limitteams 0
mp_falldamage 0
mp_autoteambalance 0
mp_timelimit 30
autobhop_enabled 1
