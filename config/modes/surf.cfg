// Surf mode. scoutzknivez.amxx execs server.cfg and then this file on every
// map; movement.amxx (addons/amxmodx/configs/modes/surf.ini) runs the timer
// zones, checkpoints and top lists. A mode sets every one of the first block,
// so nothing is left over from the mode before it.
sv_gravity 800
sv_airaccelerate 100
mp_freezetime 0
mp_buytime 0
mp_roundtime 9
mp_startmoney 800
bot_knives_only 0

// Same Kreedz legal list as climb.cfg (https://kreedz.com/rules, Settings,
// checked 2026-11-26), except the two values a surf ramp needs: air
// acceleration 100 (the block above) and a speed cap of 3500. Kreedz's 2000
// cap cuts speed on a long ramp. Both files set every value so a climb map
// next in the rotation puts them back.
sv_accelerate 5
sv_friction 4
edgefriction 2
sv_stopspeed 75
sv_maxvelocity 3500
sv_maxspeed 320
sv_stepsize 18
sv_wateraccelerate 10

// movement.amxx resets the first four when the mode is left; the rest are
// server.cfg's. Free look while dead or spectating (server.cfg sets
// chasecam 2). There is no separate movement server.cfg; this file runs
// after it.
mp_round_infinite 1
mp_forcerespawn 1
mp_limitteams 0
mp_falldamage 0
mp_autoteambalance 0
mp_forcechasecam 0
// 40 minutes, inside the 30 to 45 range. A checkpoint run on a long map
// outlasts 30 often enough to matter, and five maps still turn over. The
// clock still ends a run that is going when it hits zero; rtv changes sooner.
mp_timelimit 40
autobhop_enabled 1
