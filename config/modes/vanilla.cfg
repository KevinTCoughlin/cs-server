// Vanilla mode: stock Counter-Strike rules, buying and the map's objectives.
// scoutzknivez.amxx execs server.cfg and then this file on every map and
// leaves spawns and buying alone. The plugin list for this mode is
// addons/amxmodx/configs/modes/vanilla.ini (no bunny hop, no kill sounds).
// The hostname is server.cfg's.
sv_gravity 800
sv_airaccelerate 10
// Surf sets 3500. This puts the stock cap back; a cvar survives the map change.
sv_maxvelocity 2000
mp_freezetime 6
mp_buytime 1.5
mp_roundtime 5
mp_startmoney 800
mp_c4timer 35
bot_knives_only 0
