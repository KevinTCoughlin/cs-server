// Climb mode (KZ). scoutzknivez.amxx execs server.cfg and then this file on
// every map; movement.amxx (addons/amxmodx/configs/modes/climb.ini) runs the
// timer, checkpoints and top lists. A mode sets every one of the first block,
// so nothing is left over from the mode before it.
sv_gravity 800
sv_airaccelerate 10
mp_freezetime 0
mp_buytime 0
mp_roundtime 9
mp_startmoney 800
bot_knives_only 0

// Kreedz legal physics, the "Settings" list at https://kreedz.com/rules
// (checked 2026-11-26): edgefriction 2, sv_gravity 800, sv_stopspeed 75,
// sv_maxspeed 320, sv_accelerate 5, sv_airaccelerate 10, sv_wateraccelerate 10,
// sv_friction 4, sv_stepsize 18, sv_maxvelocity 2000. Gravity and air
// acceleration are in the block above. surf.cfg sets this whole list too
// (its air acceleration is 100 and its speed cap is 3500). A cvar left unset
// would survive the map change.
sv_accelerate 5
sv_friction 4
edgefriction 2
sv_stopspeed 75
sv_maxvelocity 2000
sv_maxspeed 320
sv_stepsize 18
sv_wateraccelerate 10

// No round ever ends, and a fall puts you back in at once. movement.amxx
// resets these four when the mode is left; the rest are server.cfg's.
// Free look while dead or spectating (server.cfg sets chasecam 2). There is
// no separate movement server.cfg; this file runs after it.
mp_round_infinite 1
mp_forcerespawn 1
mp_limitteams 0
mp_falldamage 1
mp_autoteambalance 0
mp_forcechasecam 0
// 60 minutes. The old 30 cut a first attempt on kz_man_everest and any run
// still going when the clock hit zero. 60 is one long attempt plus retries.
// rtv still changes the map sooner. 0 would leave an empty server on one map.
mp_timelimit 60
// Climbers time their own jumps.
autobhop_enabled 0
