// ScoutzKnivez mode (default): scout and knife in low gravity.
// scoutzknivez.amxx execs server.cfg and then this file on every map. A mode
// sets every one of these, so nothing is left over from the mode before it.
sv_gravity 240
sv_airaccelerate 100
// Surf sets 3500. This puts the stock cap back; a cvar survives the map change.
sv_maxvelocity 2000
mp_freezetime 0
mp_buytime 0
mp_roundtime 3
mp_startmoney 16000
bot_knives_only 0
