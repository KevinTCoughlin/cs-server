// Match mode: 5v5 competitive rules. These are the settings of the live
// match; match.amxx lays warmup settings over them until the teams are ready
// and execs this file again when the match goes live (see match.sma).
// scoutzknivez.amxx execs server.cfg and then this file on every map.
// First to 16 of 30 rounds; sides swap after 15 (match_half).
sv_gravity 800
sv_airaccelerate 10
mp_freezetime 15
mp_buytime 0.25
mp_roundtime 1.75
mp_startmoney 800
mp_c4timer 35
bot_knives_only 0

mp_forcerespawn 0
mp_round_infinite 0
mp_friendlyfire 1
mp_autoteambalance 0
mp_limitteams 0
mp_forcechasecam 2
sv_alltalk 0
mp_timelimit 0
mp_maxrounds 30
mp_winlimit 16
