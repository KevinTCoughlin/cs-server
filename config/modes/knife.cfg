// Knife mode — "Nipper Friday". Exec'd by scoutzknivez.amxx right after
// server.cfg on every map while `localinfo sk_mode` is "knife". A mode sets
// every one of these, so nothing is left over from the mode before it.
hostname "ScoutzKnivez | Nipper Friday (knives only, maps by NIPPER)"
sv_gravity 800
sv_airaccelerate 10
mp_freezetime 0
mp_buytime 0
mp_roundtime 2
mp_startmoney 800
bot_knives_only 1
