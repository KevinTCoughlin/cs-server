
// --- cs-server: appended to the game's stock server.cfg at image build ---
// Rates for current connections
sv_maxrate 25000
sv_minrate 5000
sv_maxupdaterate 101
sv_minupdaterate 10
sv_unlag 1
sv_allowdownload 1
sv_allowupload 0
sv_cheats 0
pausable 0
mp_timelimit 30

// Query flood limits, ban logging, one log file per start, rcon lockout
sv_max_queries_sec 3
sv_max_queries_window 30
sv_logbans 1
sv_log_onefile 1
sv_rcon_maxfailures 5
sv_rcon_banpenalty 60
sv_filterban 1
