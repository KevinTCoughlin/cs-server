hostname "ScoutzKnivez"

// ScoutzKnivez gameplay
sv_gravity 240
sv_airaccelerate 100
mp_freezetime 0
mp_buytime 0
mp_roundtime 3
mp_startmoney 16000
mp_autoteambalance 1
mp_friendlyfire 0

// Network
sv_maxrate 25000
sv_minrate 5000
sv_maxupdaterate 101
sv_minupdaterate 10
sv_maxcmdrate 101
sv_mincmdrate 10

// Hit registration / lag compensation
sv_unlag 1
sv_maxunlag 0.5

// Performance — target 1000 FPS server tick
sys_ticrate 1000

// FastDL — clients download custom content via HTTP instead of game server
sv_allowdownload 1
sv_downloadurl "https://kevintcoughlin.com/cs-server/cstrike/"

// General
mp_timelimit 30
mp_winlimit 0
mp_maxrounds 0
sv_alltalk 1
mp_forcechasecam 2

// Bots
bot_quota 10
bot_quota_mode "fill"
bot_difficulty 1
bot_join_after_player 0
bot_auto_vacate 1
bot_allow_rogues 0
bot_knives_only 0

// Anti-abuse
sv_max_queries_sec 3
sv_max_queries_window 30
sv_logbans 1
sv_log_onefile 1
sv_rcon_maxfailures 5
sv_rcon_banpenalty 60
sv_filterban 1
